<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#FAF7F0; --ink:#221F1A; --ink-soft:#5B564C;
  --accent:#2F4B3C; --line:#DCD5C4; --panel:#F1ECDF;
  --serif:'Source Serif 4', Georgia, serif; --sans:'Work Sans', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B1A16; --ink:#EDE8DC; --ink-soft:#B0AA98;
    --accent:#8FBE9F; --line:#3A382E; --panel:#242219;
  }
}
:root[data-theme="dark"]{ --paper:#1B1A16; --ink:#EDE8DC; --ink-soft:#B0AA98; --accent:#8FBE9F; --line:#3A382E; --panel:#242219; }
:root[data-theme="sepia"]{ --paper:#F1E7D0; --ink:#3B2E1E; --ink-soft:#79674C; --accent:#7A4B2A; --line:#DCC9A0; --panel:#E7D8B8; }
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--paper); color:var(--ink); font-family:var(--sans); padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
.app{display:flex; height:100vh; height:100dvh}
.side{width:260px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; overflow:hidden;}
.side-head{padding:18px 16px 10px; border-bottom:1px solid var(--line)}
.side-head h1{font-size:15px; margin:0 0 2px; font-weight:600}
.side-head p{margin:0; font-size:12px; color:var(--ink-soft)}
.tabs{display:flex; border-bottom:1px solid var(--line)}
.tabs button{flex:1; background:none; border:none; padding:9px 4px; font-family:var(--sans); font-size:12px; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent}
.tabs button.active{color:var(--ink); border-color:var(--accent)}
.toc,.hlist{overflow-y:auto; flex:1; padding:8px; display:none}
.toc.show,.hlist.show{display:block}
.toc button{display:block; width:100%; text-align:left; background:none; border:none; color:var(--ink); font-family:var(--sans); font-size:13px; padding:9px 10px; border-radius:6px; cursor:pointer; line-height:1.3;}
.toc button:hover{background:var(--line)}
.toc button.active{background:var(--accent); color:var(--paper)}
.hl-card{padding:9px 10px; margin-bottom:6px; border-radius:8px; background:var(--paper); border:1px solid var(--line); cursor:pointer; font-size:12.5px; line-height:1.4;}
.hl-card .swatch{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px;}
.hl-card .snippet{color:var(--ink)}
.hl-card .cmt{color:var(--ink-soft); margin-top:4px; font-style:italic}
.hl-empty{color:var(--ink-soft); font-size:12.5px; padding:10px}
.hl-export{display:flex; gap:8px; padding:10px 10px 0}
.hl-export button{flex:1; background:var(--panel); border:1px solid var(--line); color:var(--ink); font-family:var(--sans); font-size:12px; padding:8px 4px; border-radius:7px; cursor:pointer;}
.hl-export button:hover{border-color:var(--accent)}
#hlistItems{padding:8px 8px 8px}
.main{flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; overflow:hidden;}
.topbar{display:flex; align-items:center; gap:10px; padding:10px 16px; padding-top:calc(10px + env(safe-area-inset-top,0px)); border-bottom:1px solid var(--line); background:var(--paper); flex-wrap:wrap; flex-shrink:0;}
.topbar .title{font-size:13px; color:var(--ink-soft); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ctrl{display:flex; align-items:center; gap:6px}
button.icon{background:var(--panel); border:1px solid var(--line); color:var(--ink); width:32px; height:32px; border-radius:7px; cursor:pointer; font-family:var(--sans); font-size:13px;}
button.icon:hover{border-color:var(--accent)}
label.upload{background:var(--accent); color:var(--paper); border:none; padding:8px 14px; border-radius:7px; font-family:var(--sans); font-size:13px; font-weight:500; cursor:pointer;}
input[type=file]{display:none}
.bookbar{height:3px; background:var(--line); position:relative; flex-shrink:0;}
.bookbar i{position:absolute; left:0; top:0; height:100%; background:var(--accent); width:0%; transition:width .3s}

/* -------- Visor paginado: páginas explícitas del tamaño del viewport -------- */
.reader-wrap{
  flex:1;
  position:relative;
  overflow:hidden;
  min-height:0;
  background:var(--paper);
}
.pages-host{
  position:absolute; inset:0;
}
.page-view{
  position:absolute; inset:0;
  display:none;
  overflow:hidden;
}
.page-view.active{display:block}
.page-inner{
  width:100%;
  height:100%;
  padding: 40px max(24px, calc((100% - 720px) / 2));
  font-family: var(--serif);
  line-height: 1.65;
  font-size: var(--fs, 19px);
  overflow:hidden;
}
.page-inner img{
  max-width:100%;
  height:auto;
  display:block;
  margin: 12px auto;
}
.page-inner h1,.page-inner h2,.page-inner h3{font-family:var(--serif); line-height:1.25}
.page-inner p{margin:0 0 1em}

/* Capítulos "solo imagen" (portadas, ilustraciones sueltas): centrado total */
.page-inner.image-page{
  display:flex;
  align-items:center;
  justify-content:center;
  padding: 20px;
}
.page-inner.image-page img{
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  object-fit:contain;
  margin:auto;
}

/* --- Subrayados --- */
mark.h-yellow{background:#F6D888 !important; color:inherit !important; padding:1px 2px; border-radius:2px;}
mark.h-green{background:#B9E3BE !important; color:inherit !important; padding:1px 2px; border-radius:2px;}
mark.h-blue{background:#B9D6EE !important; color:inherit !important; padding:1px 2px; border-radius:2px;}
mark.h-pink{background:#F0C3DA !important; color:inherit !important; padding:1px 2px; border-radius:2px;}
:root[data-theme="dark"] mark{color:#1B1A16 !important}
mark{border-radius:2px; cursor:pointer; padding:0 1px; -webkit-box-decoration-break:clone; box-decoration-break:clone;}
mark.has-cmt{box-shadow:0 2px 0 var(--ink) inset}

.empty{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; color:var(--ink-soft); text-align:center; padding:24px; overflow-y:auto;}
.empty .big{font-family:var(--serif); font-size:22px; color:var(--ink)}
.library{width:100%; max-width:760px; display:flex; flex-direction:column; gap:10px; padding:8px 0 24px;}
.lib-card{display:flex; gap:12px; padding:12px 14px; border-radius:10px; background:var(--panel); border:1px solid var(--line); cursor:pointer; text-align:left; align-items:center;}
.lib-card:hover{border-color:var(--accent)}
.lib-card .cover{width:56px; height:76px; flex-shrink:0; border-radius:6px; overflow:hidden; background:linear-gradient(160deg, var(--accent), var(--ink-soft)); display:flex; align-items:center; justify-content:center; color:var(--paper); font-family:var(--serif); font-size:22px; font-weight:600;}
.lib-card .cover img{width:100%; height:100%; object-fit:cover; display:block;}
.lib-card .info{flex:1; min-width:0;}
.lib-card .info h3{margin:0 0 3px; font-family:var(--serif); font-size:16px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.lib-card .info p{margin:0; font-size:12.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.lib-card .info .prog{margin-top:6px; font-size:11.5px; color:var(--ink-soft);}
.lib-card .del{background:none; border:none; color:var(--ink-soft); font-size:18px; cursor:pointer; padding:4px 8px;}
.lib-card .del:hover{color:#c0392b}
.lib-actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:6px;}
.lib-actions button, .lib-actions label{background:var(--accent); color:var(--paper); border:none; padding:10px 18px; border-radius:8px; font-family:var(--sans); font-size:13px; font-weight:500; cursor:pointer;}
.lib-actions label.secondary{background:var(--panel); color:var(--ink); border:1px solid var(--line);}
.lib-empty{font-size:13px; color:var(--ink-soft); padding:20px; border:1px dashed var(--line); border-radius:10px; width:100%; max-width:760px;}
.nav-foot{display:flex; flex-direction:column; gap:4px; padding:8px 16px; padding-bottom:calc(8px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line); background:var(--paper); flex-shrink:0;}
.nav-foot .row{display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--ink-soft); gap:10px;}
.nav-foot button{background:none; border:1px solid var(--line); color:var(--ink); padding:7px 14px; border-radius:7px; cursor:pointer; font-family:var(--sans); font-size:13px;}
.nav-foot button:disabled{opacity:.35; cursor:default}
#selToolbar{position:fixed; display:none; background:var(--ink); border-radius:20px; padding:6px 8px; gap:6px; z-index:20; box-shadow:0 4px 14px rgba(0,0,0,.25)}
#selToolbar.show{display:flex}
#selToolbar button{width:22px; height:22px; border-radius:50%; border:2px solid var(--paper); cursor:pointer; padding:0}
#selToolbar .cmtbtn{width:auto; height:22px; border-radius:11px; border:none; background:var(--paper); color:var(--ink); font-size:11px; padding:0 8px; font-family:var(--sans)}
#loading{position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; color:#fff; font-family:var(--sans); font-size:14px; z-index:50; flex-direction:column; gap:12px; text-align:center; padding:20px;}
#loading.show{display:flex}
#loading .spinner{width:34px; height:34px; border:3px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite;}
#loading .progbar{width:220px; height:6px; background:rgba(255,255,255,.2); border-radius:3px; overflow:hidden;}
#loading .progbar i{display:block; height:100%; width:0; background:#fff; transition:width .2s;}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:720px){
  .side{position:fixed; z-index:5; height:100%; transform:translateX(-100%); transition:transform .2s}
  .side.open{transform:translateX(0)}
  .page-inner{padding:24px 18px}
  .lib-card .cover{width:48px; height:66px;}
}
</style>
</head>
<body>

</div>

<script>
const themes=['light','dark','sepia']; let themeIdx=0;
const fontSizes=[16,17,18,19,21,23,25]; let fontIdx=3;
let spine=[], zip=null, opfDir='', currentIndex=0, tocItems=[];
let bookId='', highlights=[], wordCounts=[], totalBookWords=0, pendingRange=null;
let chapterStart=0, activeMs=0, hidden=false;
let bookCoverDataUrl='';

// Paginación
let currentPage=0;
let totalPages=1;
let pageRestoreTarget=0;
let pendingGoLastPage=false;
let pageNodes=[];

const $=s=>document.querySelector(s);
const readerWrap=$('#readerWrap'), emptyEl=$('#emptyState'), tocEl=$('#toc'),
  hlistEl=$('#hlist'), chapterTitleEl=$('#chapterTitle'), navFoot=$('#navFoot'),
  prevBtn=$('#prevBtn'), nextBtn=$('#nextBtn'), progressEl=$('#progress'),
  timeLeftEl=$('#timeLeft'), bookProgress=$('#bookProgress'), selToolbar=$('#selToolbar'),
  libraryListEl=$('#libraryList'), libActionsEl=$('#libActions'), loadingEl=$('#loading'),
  loadingTextEl=$('#loadingText'), loadingBar=$('#loadingBar'), loadingBarFill=$('#loadingBarFill'),
  pagesHost=$('#pagesHost'),
  pageIndicatorEl=$('#pageIndicator'), chapterProgressEl=$('#chapterProgress');

document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ activeMs += Date.now()-chapterStart; hidden=true; }
  else { chapterStart=Date.now(); hidden=false; }
});

function loadJSON(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function saveJSON(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function getStats(){ return loadJSON('epubStats', {totalWords:0, totalMinutes:0}); }
function recordSession(words, minutes){
  if(minutes < 0.15 || words < 20) return;
  const s=getStats(); s.totalWords+=words; s.totalMinutes+=minutes; saveJSON('epubStats', s); pushStats();
}
function avgWpm(){ const s=getStats(); return s.totalMinutes>0.3 ? Math.max(80, s.totalWords/s.totalMinutes) : 200; }

function showLoading(text, showBar){
  loadingTextEl.textContent = text || 'Cargando…';
  loadingBar.style.display = showBar ? 'block' : 'none';
  loadingBarFill.style.width = '0%';
  loadingEl.classList.add('show');
}
function setLoadingProgress(pct){ loadingBarFill.style.width = Math.max(0,Math.min(100,pct))+'%'; }
function hideLoading(){ loadingEl.classList.remove('show'); }

// ---------- Firebase ----------
const firebaseConfig = {
  apiKey: "AIzaSyAESUMrg4kBhqhKDgANTBrkfyZjaiYYsK8",
  authDomain: "ereader-69997.firebaseapp.com",
  projectId: "ereader-69997",
  storageBucket: "ereader-69997.firebasestorage.app",
  messagingSenderId: "596698647357",
  appId: "1:596698647357:web:afaa6a8f0a31c12e6f9354"
};
let fbAuth=null, fbDb=null, cloudUid=null, cloudReady=false, firebaseConfigured=false;
let authReadyResolve; const authReadyPromise=new Promise(r=>authReadyResolve=r);

let bookSessionId=0;
let cloudSyncInFlight=0;
let renderSequence=0;

const CHUNK_SIZE = 600 * 1024;
const MAX_COVER_BYTES = 200 * 1024;

(function initFirebase(){
  if(!firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf('TU_')===0){ authReadyResolve(); return; }
  try{
    firebase.initializeApp(firebaseConfig);
    fbAuth=firebase.auth();
    fbDb=firebase.firestore();
    firebaseConfigured=true;
    $('#signInBtn').style.display='inline-block';
    let first=true;
    fbAuth.onAuthStateChanged(async user=>{
      cloudUid=user?user.uid:null;
      cloudReady=!!cloudUid;

      $('#syncBadge').textContent = cloudReady
        ? 'Sincronizado en la nube ☁ ('+(user.displayName||user.email||'Cuenta')+')'
        : '';

      $('#signInBtn').textContent = cloudReady
        ? 'Cerrar sesión'
        : 'Iniciar sesión con Google';

      if(first){ first=false; authReadyResolve(); }

      if(cloudReady){
        try{
          const snap=await fbDb.doc('users/'+cloudUid).get();
          if(snap.exists && snap.data().stats){
            saveJSON('epubStats', snap.data().stats);
          }
        }catch(e){ console.error('FIREBASE stats read ERROR:', e); }

        if(bookId) syncCurrentBookFromCloud().catch(e=>console.error('FIREBASE book sync ERROR:', e));
        if(pagesHost.style.display==='none') loadLibrary();
      }else{
        if(pagesHost.style.display==='none') loadLibrary();
      }
    });
  }catch(e){
    console.error('FIREBASE initialization ERROR:', e);
    authReadyResolve();
  }
})();

function handleSignIn(){
  if(!firebaseConfigured){ alert('Firebase no está configurado.'); return; }
  if(cloudReady){ fbAuth.signOut(); return; }
  fbAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{
    console.error('FIREBASE signIn ERROR:', e);
    if(e && e.code!=='auth/popup-closed-by-user'){
      alert('No se pudo iniciar sesión: '+(e.message||e.code||e));
    }
  });
}
$('#signInBtn').onclick=handleSignIn;
$('#signInLibBtn').onclick=handleSignIn;

function pushStats(){ if(!cloudReady) return; try{ fbDb.doc('users/'+cloudUid).set({stats:getStats()}, {merge:true}).catch(()=>{}); }catch(e){} }

function pushBookState(){
  if(!cloudReady || !bookId) return;
  const syncBookId=bookId, syncUid=cloudUid;
  const data={
    currentIndex,
    highlights,
    pageIndex: currentPage,
    updatedAt: Date.now()
  };
  try{
    fbDb.doc('users/'+syncUid+'/books/'+syncBookId)
      .set(data, {merge:true})
      .catch(e=>console.error('FIREBASE pushBookState ERROR:', e));
  }catch(e){ console.error('FIREBASE pushBookState ERROR:', e); }
}

async function pullBookState(bookIdOverride=bookId, uidOverride=cloudUid){
  if(!cloudReady || !bookIdOverride || !uidOverride) return null;
  try{
    const snap=await fbDb.doc('users/'+uidOverride+'/books/'+bookIdOverride).get();
    return snap.exists?snap.data():null;
  }catch(e){ console.error('FIREBASE pullBookState ERROR:', e); return null; }
}

async function syncCurrentBookFromCloud(){
  if(!cloudReady || !bookId || !spine.length) return;
  const syncId=++cloudSyncInFlight;
  const syncBookId=bookId, syncUid=cloudUid;
  const syncSession=bookSessionId, syncIndex=currentIndex;

  const remote=await pullBookState(syncBookId, syncUid);
  if(syncId!==cloudSyncInFlight) return;
  if(syncBookId!==bookId || syncUid!==cloudUid) return;
  if(syncSession!==bookSessionId) return;

  if(remote){
    const remoteHighlights=Array.isArray(remote.highlights)?remote.highlights:[];
    highlights=remoteHighlights;
    saveJSON('epubHl_'+bookId, highlights);

    const remoteIndex=typeof remote.currentIndex==='number'
      ? Math.max(0, Math.min(remote.currentIndex, spine.length-1))
      : 0;
    const remotePage=typeof remote.pageIndex==='number' ? remote.pageIndex : 0;
    const userNavigated=(currentIndex!==syncIndex);

    if(!userNavigated){
      saveJSON('epubProg_'+bookId, {index: remoteIndex, pageIndex: remotePage});
      pageRestoreTarget = remotePage;
      await renderChapter(remoteIndex);
    }else{
      renderHlist();
      applyHighlights();
    }
  }else{
    pushBookState();
  }
}

// ---------- Subida/bajada del EPUB por chunks a Firestore ----------
function arrayBufferToBase64(buf){
  let binary='';
  const bytes=new Uint8Array(buf);
  const CH=0x8000;
  for(let i=0;i<bytes.length;i+=CH){
    binary+=String.fromCharCode.apply(null, bytes.subarray(i, i+CH));
  }
  return btoa(binary);
}
function base64ToArrayBuffer(b64){
  const binary=atob(b64);
  const len=binary.length;
  const bytes=new Uint8Array(len);
  for(let i=0;i<len;i++) bytes[i]=binary.charCodeAt(i);
  return bytes.buffer;
}

async function uploadBookToCloud(buf, meta){
  if(!cloudReady || !fbDb) return;
  const docRef=fbDb.doc('users/'+cloudUid+'/books/'+meta.bookId);
  const existing=await docRef.get();
  if(existing.exists && existing.data().chunks){
    await docRef.set({
      title: meta.title, author: meta.author,
      totalChapters: meta.totalChapters||0,
      cover: meta.cover||''
    }, {merge:true});
    return;
  }

  const totalChunks=Math.ceil(buf.byteLength / CHUNK_SIZE);
  showLoading('Subiendo a la nube… 0 / '+totalChunks, true);

  await docRef.set({
    bookId: meta.bookId,
    title: meta.title,
    author: meta.author,
    totalChapters: meta.totalChapters||0,
    chunks: totalChunks,
    size: buf.byteLength,
    addedAt: Date.now(),
    currentIndex: 0,
    highlights: [],
    pageIndex: 0,
    cover: meta.cover||''
  }, {merge:true});

  const chunksCol=docRef.collection('chunks');
  for(let i=0;i<totalChunks;i++){
    const slice=buf.slice(i*CHUNK_SIZE, Math.min((i+1)*CHUNK_SIZE, buf.byteLength));
    const b64=arrayBufferToBase64(slice);
    await chunksCol.doc(String(i)).set({ data: b64 });
    setLoadingProgress(Math.round((i+1)/totalChunks*100));
    loadingTextEl.textContent='Subiendo a la nube… '+(i+1)+' / '+totalChunks;
  }

  hideLoading();
}

async function downloadBookFromCloud(bookIdToLoad){
  if(!cloudReady) throw new Error('No hay sesión en la nube.');
  const docRef=fbDb.doc('users/'+cloudUid+'/books/'+bookIdToLoad);
  const snap=await docRef.get();
  if(!snap.exists) throw new Error('Libro no encontrado en la nube.');
  const meta=snap.data();
  const totalChunks=meta.chunks||0;
  if(!totalChunks) throw new Error('Este libro no tiene archivo guardado en la nube.');

  const chunksCol=docRef.collection('chunks');
  const parts=[];
  for(let i=0;i<totalChunks;i++){
    const cs=await chunksCol.doc(String(i)).get();
    if(!cs.exists) throw new Error('Falta el fragmento '+i+' del libro.');
    parts.push(base64ToArrayBuffer(cs.data().data));
    setLoadingProgress(Math.round((i+1)/totalChunks*100));
    loadingTextEl.textContent='Descargando libro… '+(i+1)+' / '+totalChunks;
  }
  let total=0; parts.forEach(p=>total+=p.byteLength);
  const out=new Uint8Array(total);
  let off=0; parts.forEach(p=>{ out.set(new Uint8Array(p), off); off+=p.byteLength; });
  return { buf: out.buffer, meta };
}

function renderLibrary(list){
  libActionsEl.style.display='flex';
  $('#signInLibBtn').style.display='none';

  if(!list.length){
    libraryListEl.innerHTML='<div class="lib-empty">Aún no tienes libros en la nube. Añade un EPUB para empezar.</div>';
    return;
  }
  libraryListEl.innerHTML='';
  list.forEach(b=>{
    const card=document.createElement('div');
    card.className='lib-card';
    const initial=(b.title||'?').trim().charAt(0).toUpperCase();
    const total=b.totalChapters||0;
    const idx=typeof b.currentIndex==='number'?b.currentIndex:0;
    const pct = total>0 ? Math.round((idx+1)/total*100) : 0;
    const coverHtml = b.cover
      ? '<div class="cover"><img src="'+b.cover+'" alt=""></div>'
      : '<div class="cover">'+escapeHtml(initial)+'</div>';
    card.innerHTML=
      coverHtml+
      '<div class="info">'+
        '<h3>'+escapeHtml(b.title||'Sin título')+'</h3>'+
        '<p>'+escapeHtml(b.author||'')+'</p>'+
        '<div class="prog">'+(total?('Capítulo '+(idx+1)+' de '+total+' · '+pct+'%'):'')+'</div>'+
      '</div>'+
      '<button class="del" title="Eliminar de la nube">✕</button>';
    const openFn=()=>openCloudBook(b);
    card.querySelector('.info').onclick=openFn;
    card.querySelector('.cover').onclick=openFn;
    card.querySelector('.del').onclick=async ev=>{
      ev.stopPropagation();
      if(!confirm('¿Eliminar "'+(b.title||'este libro')+'" de tu biblioteca en la nube?')) return;
      try{
        const chunksCol=fbDb.collection('users/'+cloudUid+'/books/'+b.id+'/chunks');
        const cs=await chunksCol.get();
        const batch=fbDb.batch();
        cs.docs.forEach(d=>batch.delete(d.ref));
        batch.delete(fbDb.doc('users/'+cloudUid+'/books/'+b.id));
        await batch.commit();
        try{ localStorage.removeItem('epubHl_'+b.id); localStorage.removeItem('epubProg_'+b.id); }catch(e){}
        loadLibrary();
      }catch(e){
        alert('No se pudo eliminar: '+(e.message||e));
      }
    };
    libraryListEl.appendChild(card);
  });
}

async function openCloudBook(meta){
  showLoading('Descargando "'+(meta.title||'libro')+'"…', true);
  try{
    const { buf, meta: fullMeta }=await downloadBookFromCloud(meta.id);
    if(Array.isArray(fullMeta.highlights)) saveJSON('epubHl_'+meta.id, fullMeta.highlights);
    if(typeof fullMeta.currentIndex==='number'){
      saveJSON('epubProg_'+meta.id, {
        index: fullMeta.currentIndex,
        pageIndex: typeof fullMeta.pageIndex==='number' ? fullMeta.pageIndex : 0
      });
    }
    hideLoading();
    await loadEpub(buf);
  }catch(e){
    hideLoading();
    console.error('openCloudBook ERROR:', e);
    alert('No se pudo abrir el libro: '+(e.message||e));
  }
}

// ---------- epub parsing ----------
function resolvePath(base, rel){
  if(rel.startsWith('/')) return rel.slice(1);
  const baseParts=base.split('/'); baseParts.pop();
  for(const p of rel.split('/')){ if(p==='..') baseParts.pop(); else if(p!=='.') baseParts.push(p); }
  return baseParts.join('/');
}
async function findFile(path){
  let f=zip.file(path);
  if(!f){ const c=path.split('#')[0]; f=zip.file(c)||zip.file(decodeURIComponent(c)); }
  return f;
}
function plainText(html){
  const d=document.createElement('div'); d.innerHTML=html;
  return (d.textContent||'').replace(/\s+/g,' ').trim();
}
function wordCount(txt){ return txt ? txt.split(' ').filter(Boolean).length : 0; }

async function extractCover(opfDoc, manifest){
  try{
    const metaCover=opfDoc.querySelector('metadata > meta[name="cover"]');
    let coverId=metaCover?metaCover.getAttribute('content'):null;
    if(!coverId){
      const item=opfDoc.querySelector('manifest > item[properties~="cover-image"]');
      if(item) coverId=item.getAttribute('id');
    }
    if(coverId && manifest[coverId]){
      const f=await findFile(manifest[coverId].href);
      if(f){
        const blob=await f.async('blob');
        const dataUrl=await blobToDataURL(blob, MAX_COVER_BYTES);
        if(dataUrl) return dataUrl;
      }
    }
  }catch(e){ console.warn('cover meta:', e); }

  try{
    if(spine.length){
      const f=await findFile(spine[0]);
      if(f){
        const html=await f.async('string');
        const doc=new DOMParser().parseFromString(html,'application/xhtml+xml');
        const img=doc.querySelector('img, image');
        if(img){
          const attr=img.hasAttribute('src')?'src':(img.hasAttribute('xlink:href')?'xlink:href':null);
          const rel=attr?img.getAttribute(attr):null;
          if(rel){
            const imgPath=resolvePath(spine[0], rel);
            const imgFile=await findFile(imgPath);
            if(imgFile){
              const blob=await imgFile.async('blob');
              const dataUrl=await blobToDataURL(blob, MAX_COVER_BYTES);
              if(dataUrl) return dataUrl;
            }
          }
        }
      }
    }
  }catch(e){ console.warn('cover first chapter:', e); }

  return '';
}

function blobToDataURL(blob, maxBytes){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const dataUrl=reader.result;
      if(dataUrl.length < maxBytes*1.37){ resolve(dataUrl); return; }
      const img=new Image();
      img.onload=()=>{
        const maxW=300, maxH=400;
        let w=img.width, h=img.height;
        const ratio=Math.min(maxW/w, maxH/h, 1);
        w=Math.round(w*ratio); h=Math.round(h*ratio);
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        try{ resolve(canvas.toDataURL('image/jpeg', 0.8)); }
        catch(e){ resolve(dataUrl); }
      };
      img.onerror=()=>resolve(dataUrl);
      img.src=dataUrl;
    };
    reader.onerror=()=>resolve('');
    reader.readAsDataURL(blob);
  });
}

async function loadEpub(arrayBuffer){
  showLoading('Abriendo EPUB…', false);
  try{
    zip=await JSZip.loadAsync(arrayBuffer);
    const containerXml=await zip.file('META-INF/container.xml').async('string');
    const containerDoc=new DOMParser().parseFromString(containerXml,'application/xml');
    const opfPath=containerDoc.querySelector('rootfile').getAttribute('full-path');
    opfDir=opfPath.includes('/')?opfPath.slice(0,opfPath.lastIndexOf('/')+1):'';
    const opfXml=await zip.file(opfPath).async('string');
    const opfDoc=new DOMParser().parseFromString(opfXml,'application/xml');
    const title=opfDoc.querySelector('metadata > title')?.textContent||'Libro sin título';
    const author=opfDoc.querySelector('metadata > creator')?.textContent||'';
    $('#bookTitle').textContent=title; $('#bookAuthor').textContent=author;
    bookId=btoa(unescape(encodeURIComponent(title+'::'+author))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'').slice(0,40);

    const manifest={};
    opfDoc.querySelectorAll('manifest > item').forEach(item=>{
      manifest[item.getAttribute('id')]={href:opfDir+item.getAttribute('href'), mediaType:item.getAttribute('media-type')};
    });
    spine=[];
    opfDoc.querySelectorAll('spine > itemref').forEach(ref=>{
      const idref=ref.getAttribute('idref'); if(manifest[idref]) spine.push(manifest[idref].href);
    });

    tocItems=[];
    const navItem=Object.values(manifest).find(m=>m.mediaType==='application/xhtml+xml'&&m.href.match(/nav\.xhtml$/i));
    const ncxItem=Object.values(manifest).find(m=>m.mediaType==='application/x-dtbncx+xml');
    try{
      if(navItem){
        const navXml=await zip.file(navItem.href).async('string');
        const navDoc=new DOMParser().parseFromString(navXml,'text/html');
        navDoc.querySelectorAll('nav a').forEach(a=>{
          tocItems.push({label:a.textContent.trim()||'—', href:resolvePath(navItem.href, a.getAttribute('href')||'')});
        });
      } else if(ncxItem){
        const ncxXml=await zip.file(ncxItem.href).async('string');
        const ncxDoc=new DOMParser().parseFromString(ncxXml,'application/xml');
        ncxDoc.querySelectorAll('navPoint').forEach(np=>{
          const label=np.querySelector('navLabel > text')?.textContent.trim()||'—';
          const src=np.querySelector('content')?.getAttribute('src')||'';
          tocItems.push({label, href:resolvePath(ncxItem.href, src)});
        });
      }
    }catch(e){ tocItems=[]; }
    if(tocItems.length===0) tocItems=spine.map((h,i)=>({label:'Capítulo '+(i+1), href:h}));

    buildTocUI();

    const thisSession=++bookSessionId;

    bookCoverDataUrl=await extractCover(opfDoc, manifest);

    highlights=loadJSON('epubHl_'+bookId, []);
    const prog=loadJSON('epubProg_'+bookId, {index:0, pageIndex:0});
    pageRestoreTarget = (prog.pageIndex && prog.pageIndex>0) ? prog.pageIndex : 0;

    emptyEl.style.display='none';
    pagesHost.style.display='block';
    navFoot.style.display='flex';
    $('#libBtn').style.display='inline-block';

    applyFont();

    await renderChapter(prog.index||0);
    hideLoading();
    computeWordCounts();

    if(cloudReady){
      uploadBookToCloud(arrayBuffer, {
        bookId, title, author, totalChapters: spine.length, cover: bookCoverDataUrl
      }).catch(e=>console.error('uploadBookToCloud ERROR:', e));
    }else if(firebaseConfigured){
      authReadyPromise.then(()=>{
        if(cloudReady && bookId){
          uploadBookToCloud(arrayBuffer, {
            bookId, title, author, totalChapters: spine.length, cover: bookCoverDataUrl
          }).catch(e=>console.error('uploadBookToCloud delayed ERROR:', e));
        }
      });
    }

    if(cloudReady){
      if(thisSession===bookSessionId){
        syncCurrentBookFromCloud().catch(e=>console.error('FIREBASE background sync ERROR:', e));
      }
    }else if(firebaseConfigured){
      authReadyPromise.then(()=>{
        if(cloudReady && thisSession===bookSessionId && bookId){
          syncCurrentBookFromCloud().catch(e=>console.error('FIREBASE delayed sync ERROR:', e));
        }
      });
    }
  }catch(err){
    hideLoading();
    throw err;
  }
}

async function computeWordCounts(){
  wordCounts=new Array(spine.length).fill(0); totalBookWords=0;
  for(let i=0;i<spine.length;i++){
    try{ const f=await findFile(spine[i]); if(f){ const html=await f.async('string'); const wc=wordCount(plainText(html)); wordCounts[i]=wc; totalBookWords+=wc; } }catch(e){}
  }
  updateTimeEstimate();
}

function wordsReadSoFar(){
  let sum=0; for(let i=0;i<currentIndex;i++) sum+=wordCounts[i]||0;
  const frac = totalPages>1 ? (currentPage/(totalPages-1)) : 0;
  sum += (wordCounts[currentIndex]||0)*frac;
  return sum;
}
function updateTimeEstimate(){
  if(!totalBookWords){ timeLeftEl.textContent=''; return; }
  const read=wordsReadSoFar();
  bookProgress.style.width=Math.min(100,(read/totalBookWords*100)).toFixed(1)+'%';
  const remaining=Math.max(0,totalBookWords-read);
  const mins=Math.round(remaining/avgWpm());
  timeLeftEl.textContent = mins<1 ? 'Casi terminas' : mins<60 ? ('≈ '+mins+' min') : ('≈ '+Math.floor(mins/60)+'h '+(mins%60)+'m');
}

function goTo(i){
  if(i<0 || i>=spine.length) return;
  finishChapterTiming();
  pageRestoreTarget=0;
  pendingGoLastPage=false;
  renderChapter(i).catch(e=>console.error('Error renderizando capítulo:', e));
}

function nextPage(){
  if(currentPage < totalPages-1){
    currentPage++;
    showPage(currentPage);
    pushBookState();
    updatePageUI();
  }else{
    if(currentIndex < spine.length-1) goTo(currentIndex+1);
  }
}
function prevPage(){
  if(currentPage > 0){
    currentPage--;
    showPage(currentPage);
    pushBookState();
    updatePageUI();
  }else{
    if(currentIndex > 0){
      pendingGoLastPage=true;
      goTo(currentIndex-1);
    }
  }
}

prevBtn.onclick=prevPage;
nextBtn.onclick=nextPage;
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight') nextPage();
  if(e.key==='ArrowLeft') prevPage();
});
window.addEventListener('beforeunload', ()=>{ finishChapterTiming(); pushBookState(); });
function finishChapterTiming(){
  if(!spine.length) return;
  const ms = activeMs + (hidden?0:(Date.now()-chapterStart));
  recordSession(wordCounts[currentIndex]||0, ms/60000);
  activeMs=0;
}

function showPage(i){
  pageNodes.forEach((el,idx)=>{
    el.classList.toggle('active', idx===i);
  });
}
function updatePageUI(){
  pageIndicatorEl.textContent = 'Pág. '+(currentPage+1)+' / '+totalPages;
  chapterProgressEl.textContent = 'Cap. '+(currentIndex+1)+' / '+spine.length;
  prevBtn.disabled = (currentIndex===0 && currentPage===0);
  nextBtn.disabled = (currentIndex===spine.length-1 && currentPage===totalPages-1);
}

let repaginateTimer=null;
function repaginate(){
  if(!spine.length) return;
  clearTimeout(repaginateTimer);
  repaginateTimer=setTimeout(()=>{
    const frac = totalPages>1 ? currentPage/(totalPages-1) : 0;
    pageRestoreTarget=0;
    renderChapter(currentIndex).then(()=>{
      currentPage=Math.round(frac*(totalPages-1));
      showPage(currentPage);
      updatePageUI();
    });
  }, 250);
}
window.addEventListener('resize', repaginate);

// ---------- Render principal del capítulo ----------
async function renderChapter(index){
  if(index<0||index>=spine.length) return;
  const thisRender=++renderSequence;
  currentIndex=index;
  chapterStart=Date.now();
  activeMs=0;
  const renderBookId=bookId;

  saveJSON('epubProg_'+renderBookId, {index, pageIndex: 0});
  pushBookState();

  const path=spine[index];
  const file=await findFile(path);
  if(!file){
    pagesHost.innerHTML='<div class="page-view active"><div class="page-inner"><p>No se pudo cargar este capítulo.</p></div></div>';
    pageNodes=[pagesHost.querySelector('.page-view')];
    totalPages=1;
    return;
  }
  let html=await file.async('string');

  if(thisRender!==renderSequence || renderBookId!==bookId) return;

  const doc=new DOMParser().parseFromString(html,'application/xhtml+xml');
  const body=doc.querySelector('body')||doc.documentElement;

  // Reemplaza imágenes por blob URLs para que se vean.
  for(const img of body.querySelectorAll('img, image')){
    const attr=img.hasAttribute('src')?'src':(img.hasAttribute('xlink:href')?'xlink:href':null);
    if(!attr) continue;
    const rel=img.getAttribute(attr); if(!rel) continue;
    const imgFile=await findFile(resolvePath(path, rel));
    if(imgFile){ const blob=await imgFile.async('blob'); img.setAttribute(attr, URL.createObjectURL(blob)); }
  }

  if(thisRender!==renderSequence || renderBookId!==bookId) return;

  // ¿Es un capítulo de solo imagen? (portada, ilustración suelta)
  const textContent=(body.textContent||'').replace(/\s+/g,'').trim();
  const imgCount=body.querySelectorAll('img').length;
  const onlyImage = imgCount>0 && textContent.length<20;

  // Vamos a paginar troceando por bloques.
  const pages = onlyImage
    ? [buildImagePage(body)]
    : await paginateBlocks(body, path);

  if(thisRender!==renderSequence || renderBookId!==bookId) return;

  totalPages=pages.length;

  // Monta los page-view en el host.
  pagesHost.innerHTML='';
  pageNodes=[];
  pages.forEach((pageInner, idx)=>{
    const view=document.createElement('div');
    view.className='page-view'+(idx===0?' active':'');
    view.appendChild(pageInner);
    pagesHost.appendChild(view);
    pageNodes.push(view);
  });

  applyHighlights();
  renderHlist();

  const active=tocItems.find(t=>t.href.split('#')[0]===path.split('#')[0]);
  chapterTitleEl.textContent=active?active.label:'';
  progressEl.textContent=(index+1)+' / '+spine.length;

  let target=pageRestoreTarget||0;
  if(pendingGoLastPage){ target=totalPages-1; pendingGoLastPage=false; }
  pageRestoreTarget=0;
  currentPage=Math.max(0, Math.min(target, totalPages-1));
  showPage(currentPage);

  updateTimeEstimate();
  updatePageUI();
}

// Construye UNA página que contiene una sola imagen, centrada y sin recortes.
function buildImagePage(body){
  const inner=document.createElement('div');
  inner.className='page-inner image-page';
  // Copiamos el contenido completo. La imagen se ajusta sola.
  inner.innerHTML=body.innerHTML;
  // Forzamos todas las imágenes a que se ajusten al contenedor.
  inner.querySelectorAll('img').forEach(img=>{
    img.style.maxWidth='100%';
    img.style.maxHeight='100%';
    img.style.width='auto';
    img.style.height='auto';
    img.style.objectFit='contain';
    img.style.display='block';
    img.style.margin='auto';
  });
  return inner;
}

// Pagina el contenido troceando por bloques de primer nivel del body.
// El cálculo se hace con un contenedor "medidor" del tamaño exacto del viewport.
async function paginateBlocks(body, path){
  // Espera que las imágenes del body estén cargadas (con timeout).
  await preloadImages(body);

  // Creamos un page-inner "medidor" para saber cuánto alto tiene disponible.
  const probe=document.createElement('div');
  probe.className='page-inner';
  probe.style.position='absolute';
  probe.style.visibility='hidden';
  probe.style.left='-99999px';
  probe.style.top='0';
  pagesHost.appendChild(probe);

  // Fuerza reflow para obtener dimensiones reales.
  void probe.offsetHeight;
  const innerH = probe.clientHeight; // alto útil (descontando padding)
  const innerW = probe.clientWidth;

  // Recogemos los "bloques" del body. Un bloque puede ser un párrafo, un
  // encabezado, un div, una imagen, un texto suelto, etc.
  const blocks = [];
  for(const node of [...body.childNodes]){
    if(node.nodeType===Node.ELEMENT_NODE){
      // Si es un contenedor con varios hijos (div, section, article), lo
      // tratamos como un solo bloque. Si es muy grande ya se partirá.
      blocks.push(node.cloneNode(true));
    }else if(node.nodeType===Node.TEXT_NODE){
      if(node.nodeValue.trim().length){
        const p=document.createElement('p');
        p.textContent=node.nodeValue;
        blocks.push(p);
      }
    }
  }

  // El contenedor final donde van las páginas reales, uno por uno.
  const pages=[];
  let page=document.createElement('div');
  page.className='page-inner';
  pages.push(page);

  // Contenedor temporal "página en construcción" para medir.
  const staging=document.createElement('div');
  staging.className='page-inner';
  staging.style.position='absolute';
  staging.style.visibility='hidden';
  staging.style.left='-99999px';
  staging.style.top='0';
  staging.style.width=innerW+'px';
  pagesHost.appendChild(staging);

  const flushStaging=()=>{
    page.innerHTML=staging.innerHTML;
    staging.innerHTML='';
  };

  for(const block of blocks){
    // Clonamos el bloque y lo añadimos al staging para medir.
    const clone=block.cloneNode(true);
    staging.appendChild(clone);

    // Si el staging se pasa de alto y ya hay contenido previo, cerramos
    // la página actual y abrimos una nueva con este bloque.
    if(staging.scrollHeight > innerH && staging.childNodes.length>1){
      staging.removeChild(clone);

      // Cerramos la página actual (ya está llena).
      flushStaging();
      page=document.createElement('div');
      page.className='page-inner';
      pages.push(page);

      // Empezamos la nueva página con este bloque.
      staging.appendChild(clone);
    }

    // Si el bloque por sí solo supera la página (párrafo gigante o imagen
    // gigante), intentamos partirlo. Para imágenes no se parte: se le
    // permite ocupar toda la página (con object-fit contain).
    const isImg = clone.tagName==='IMG' || (clone.querySelector && clone.querySelector('img') && clone.textContent.trim()==='');
    if(staging.scrollHeight > innerH && staging.childNodes.length===1 && !isImg){
      // Intenta partir por párrafos internos si es un contenedor.
      const cut = splitLargeBlock(staging.firstChild, innerH);
      if(cut){
        // Reemplaza el staging por la primera mitad, y deja la segunda para
        // la siguiente iteración.
        staging.innerHTML='';
        staging.appendChild(cut.head);
        blocks.push(cut.tail); // se procesará en la próxima vuelta
      }
    }
  }
  // Cerrar la última página.
  if(staging.childNodes.length || !pages[pages.length-1].childNodes.length){
    flushStaging();
  }

  pagesHost.removeChild(staging);
  pagesHost.removeChild(probe);

  // Filtramos páginas vacías.
  return pages.filter(p=>p.textContent.trim().length>0 || p.querySelector('img'));
}

// Intenta partir un bloque grande en dos mitades (head y tail) por sus hijos.
// Devuelve null si no se puede partir.
function splitLargeBlock(block, maxH){
  if(!block || !block.children || block.children.length<2) return null;
  const head=block.cloneNode(false);
  const tail=block.cloneNode(false);
  const children=[...block.children];
  // Reparte: primero todo en head, luego mueve al tail hasta que head quepa.
  children.forEach(c=>head.appendChild(c.cloneNode(true)));

  // Medimos con un clon temporal.
  const test=document.createElement('div');
  test.style.position='absolute';
  test.style.visibility='hidden';
  test.style.left='-99999px';
  test.style.width=block.clientWidth+'px';
  test.appendChild(head);
  document.body.appendChild(test);

  let idx=children.length-1;
  while(test.scrollHeight > maxH && idx>0){
    head.removeChild(head.lastChild);
    tail.insertBefore(children[idx].cloneNode(true), tail.firstChild);
    idx--;
  }
  document.body.removeChild(test);

  if(!head.children.length || !tail.children.length) return null;
  return { head, tail };
}

function preloadImages(root){
  const imgs=[...root.querySelectorAll('img')];
  if(!imgs.length) return Promise.resolve();
  return Promise.all(imgs.map(img=>{
    if(img.complete && img.naturalWidth>0) return Promise.resolve();
    return new Promise(res=>{
      img.addEventListener('load', res, {once:true});
      img.addEventListener('error', res, {once:true});
      setTimeout(res, 3000);
    });
  }));
}

// ---------- Subrayados ----------
function nodeOffset(container, node, offsetInNode){
  let charIndex=0;
  const w=document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
  let n;
  while(n=w.nextNode()){
    if(n===node) return charIndex+offsetInNode;
    charIndex+=n.length;
  }
  return -1;
}
function rangeFromOffsets(container, start, end){
  let charIndex=0, startNode,startOffset,endNode,endOffset;
  const w=document.createTreeWalker(container, NodeFilter.SHOW_TEXT); let n;
  while(n=w.nextNode()){
    const next=charIndex+n.length;
    if(!startNode && start>=charIndex && start<=next){ startNode=n; startOffset=start-charIndex; }
    if(!endNode && end>=charIndex && end<=next){ endNode=n; endOffset=end-charIndex; }
    charIndex=next;
  }
  if(!startNode||!endNode) return null;
  const r=document.createRange(); r.setStart(startNode,startOffset); r.setEnd(endNode,endOffset); return r;
}
function rangeFromText(container, searchText){
  if(!searchText) return null;
  const needle=searchText.replace(/\s+/g,' ').trim();
  if(needle.length<2) return null;

  const walker=document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
  const nodes=[]; const starts=[]; let acc='';
  let n;
  while(n=walker.nextNode()){
    nodes.push(n); starts.push(acc.length); acc+=n.nodeValue;
  }
  const haystack=acc.replace(/\s+/g,' ');
  const escaped=needle.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+');
  const re=new RegExp(escaped);
  const m=re.exec(haystack);
  if(!m) return null;
  const matchStart=m.index, matchEnd=m.index+m[0].length;

  let startNode=null, startOffset=0, endNode=null, endOffset=0;
  for(let i=0;i<nodes.length;i++){
    const s=starts[i]; const e=s+nodes[i].nodeValue.length;
    if(!startNode && matchStart>=s && matchStart<=e){
      startNode=nodes[i]; startOffset=matchStart-s;
    }
    if(!endNode && matchEnd>=s && matchEnd<=e){
      endNode=nodes[i]; endOffset=matchEnd-s;
    }
  }
  if(!startNode||!endNode) return null;
  try{
    const r=document.createRange();
    r.setStart(startNode, startOffset);
    r.setEnd(endNode, endOffset);
    return r;
  }catch(e){ return null; }
}

function applyHighlights(){
  const chHref=spine[currentIndex];
  const hs=highlights.filter(h=>h.href===chHref).sort((a,b)=>a.start-b.start);
  pageNodes.forEach(view=>{
    const container=view.querySelector('.page-inner');
    if(!container) return;
    hs.forEach(h=>{
      let r=rangeFromOffsets(container, h.start, h.end);
      const rText=r?r.toString().replace(/\s+/g,' ').trim():'';
      const expected=(h.text||'').replace(/\s+/g,' ').trim();
      if(!r || (expected && rText && !rText.startsWith(expected.slice(0, Math.min(20, expected.length))))){
        const r2=rangeFromText(container, expected);
        if(r2) r=r2;
      }
      if(!r) return;
      if(r.startContainer.parentElement && r.startContainer.parentElement.closest('mark[data-id="'+h.id+'"]')) return;
      try{
        const frag=r.extractContents();
        const walker=document.createTreeWalker(frag, NodeFilter.SHOW_TEXT);
        const textNodes=[]; let n;
        while(n=walker.nextNode()) textNodes.push(n);
        textNodes.forEach(tn=>{
          if(!tn.nodeValue || !tn.nodeValue.trim()) return;
          const m=document.createElement('mark');
          m.className='h-'+h.color+(h.comment?' has-cmt':'');
          m.dataset.id=h.id;
          m.onclick=()=>openHlPopup(h.id);
          tn.parentNode.replaceChild(m, tn);
          m.appendChild(tn);
        });
        r.insertNode(frag);
      }catch(e){ /* rango cruzado, se ignora en esta página */ }
    });
  });
}

pagesHost.addEventListener('mouseup', onSelectionMaybe);
pagesHost.addEventListener('touchend', onSelectionMaybe);
function onSelectionMaybe(){
  setTimeout(()=>{
    const sel=window.getSelection();
    if(!sel || sel.isCollapsed || sel.rangeCount===0){ selToolbar.classList.remove('show'); return; }
    const range=sel.getRangeAt(0);
    if(!pagesHost.contains(range.commonAncestorContainer)){ return; }
    const currentView=pageNodes[currentPage];
    const container=currentView ? currentView.querySelector('.page-inner') : null;
    if(!container) return;
    pendingRange={
      start: nodeOffset(container, range.startContainer, range.startOffset),
      end: nodeOffset(container, range.endContainer, range.endOffset),
      text: sel.toString().slice(0,300)
    };
    if(pendingRange.start<0||pendingRange.end<0||pendingRange.start===pendingRange.end) return;
    const rect=range.getBoundingClientRect();
    selToolbar.style.left=Math.max(8, rect.left+rect.width/2-70)+'px';
    selToolbar.style.top=Math.max(8, rect.top-44)+'px';
    selToolbar.classList.add('show');
  },10);
}
document.addEventListener('mousedown', e=>{ if(!selToolbar.contains(e.target)) selToolbar.classList.remove('show'); });
selToolbar.querySelectorAll('button[data-c]').forEach(btn=>{
  btn.onclick=()=>{ createHighlight(btn.dataset.c, ''); selToolbar.classList.remove('show'); window.getSelection().removeAllRanges(); };
});
$('#cmtBtn').onclick=()=>{
  const comment=prompt('Escribe tu nota:'); selToolbar.classList.remove('show');
  if(comment===null) return;
  createHighlight('yellow', comment); window.getSelection().removeAllRanges();
};
function createHighlight(color, comment){
  if(!pendingRange) return;
  const h={
    id:'h'+Date.now(),
    href:spine[currentIndex],
    start:pendingRange.start,
    end:pendingRange.end,
    text:pendingRange.text,
    color,
    comment
  };
  highlights.push(h);
  saveJSON('epubHl_'+bookId, highlights);
  pushBookState();
  renderChapter(currentIndex);
}
function openHlPopup(id){
  const h=highlights.find(x=>x.id===id); if(!h) return;
  const action=prompt('Nota para este subrayado (déjalo vacío para quitar la nota):\n\nEscribe "borrar" para eliminar el subrayado.', h.comment||'');
  if(action===null) return;
  if(action.trim().toLowerCase()==='borrar'){ highlights=highlights.filter(x=>x.id!==id); }
  else { h.comment=action; }
  saveJSON('epubHl_'+bookId, highlights);
  pushBookState();
  renderChapter(currentIndex);
}
const hlistItemsEl=$('#hlistItems');
function renderHlist(){
  const colorDot={yellow:'#F6D888',green:'#B9E3BE',blue:'#B9D6EE',pink:'#F0C3DA'};
  if(!highlights.length){ hlistItemsEl.innerHTML='<div class="hl-empty">Aún no tienes subrayados. Selecciona texto en la lectura para marcarlo.</div>'; return; }
  hlistItemsEl.innerHTML='';
  highlights.slice().reverse().forEach(h=>{
    const idx=spine.indexOf(h.href);
    const card=document.createElement('div'); card.className='hl-card';
    card.innerHTML='<span class="swatch" style="background:'+(colorDot[h.color]||'#F6D888')+'"></span><span class="snippet">'+escapeHtml(h.text)+'</span>'+(h.comment?'<div class="cmt">'+escapeHtml(h.comment)+'</div>':'');
    card.onclick=()=>{ goTo(idx); $('#side').classList.remove('open'); };
    hlistItemsEl.appendChild(card);
  });
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

// ---------- export ----------
function bookTitleSafe(){ return (($('#bookTitle').textContent||'libro').replace(/[^a-z0-9\- ]/gi,'').trim().slice(0,60))||'libro'; }
function getChapterLabel(href,i){ const t=tocItems.find(t=>t.href.split('#')[0]===href.split('#')[0]); return t?t.label:'Capítulo '+(i+1); }
function groupByChapter(){
  const groups=[];
  spine.forEach((href,i)=>{
    const items=highlights.filter(h=>h.href===href).sort((a,b)=>a.start-b.start);
    if(items.length) groups.push({label:getChapterLabel(href,i), items});
  });
  return groups;
}
function saveFile(filename, blob){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
async function exportPdf(){
  if(!highlights.length){ alert('Todavía no tienes subrayados para exportar.'); return; }
  const jsPDFctor=window.jspdf && window.jspdf.jsPDF;
  if(!jsPDFctor){ alert('No se pudo cargar el generador de PDF.'); return; }
  const doc=new jsPDFctor({unit:'pt', format:'a4'});
  const marginX=48; let y=64;
  const pageH=doc.internal.pageSize.getHeight(), pageW=doc.internal.pageSize.getWidth(), maxW=pageW-marginX*2;
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(20);
  doc.text($('#bookTitle').textContent||'Subrayados', marginX, y); y+=22;
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(120);
  doc.text($('#bookAuthor').textContent||'', marginX, y); y+=26; doc.setTextColor(20);
  const colorMap={yellow:[246,216,136], green:[185,227,190], blue:[185,214,238], pink:[240,195,218]};
  groupByChapter().forEach(g=>{
    if(y>pageH-90){ doc.addPage(); y=64; }
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(20);
    doc.text(g.label, marginX, y); y+=18;
    g.items.forEach(h=>{
      const lines=doc.splitTextToSize(h.text, maxW-14);
      const cLines=h.comment?doc.splitTextToSize('Nota: '+h.comment, maxW-14):[];
      const blockH=lines.length*14 + cLines.length*12 + 20;
      if(y+blockH>pageH-56){ doc.addPage(); y=64; }
      const c=colorMap[h.color]||colorMap.yellow;
      doc.setFillColor(c[0],c[1],c[2]); doc.rect(marginX-6, y-10, 4, lines.length*14+2, 'F');
      doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(30);
      doc.text(lines, marginX+6, y); y+=lines.length*14+2;
      if(cLines.length){
        doc.setFont('helvetica','italic'); doc.setFontSize(10); doc.setTextColor(110);
        doc.text(cLines, marginX+6, y); y+=cLines.length*12+4; doc.setTextColor(30);
      }
      y+=10;
    });
    y+=8;
  });
  await saveFile(bookTitleSafe()+'-subrayados.pdf', doc.output('blob'));
}
async function exportDocx(){
  if(!highlights.length){ alert('Todavía no tienes subrayados para exportar.'); return; }
  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const hlMap={yellow:'yellow',green:'green',blue:'cyan',pink:'magenta'};
  let body='';
  body+='<w:p><w:r><w:rPr><w:b/><w:sz w:val="32"/></w:rPr><w:t>'+esc($('#bookTitle').textContent||'Subrayados')+'</w:t></w:r></w:p>';
  body+='<w:p><w:r><w:rPr><w:i/><w:color w:val="666666"/></w:rPr><w:t>'+esc($('#bookAuthor').textContent||'')+'</w:t></w:r></w:p><w:p/>';
  groupByChapter().forEach(g=>{
    body+='<w:p><w:r><w:rPr><w:b/><w:sz w:val="26"/></w:rPr><w:t>'+esc(g.label)+'</w:t></w:r></w:p>';
    g.items.forEach(h=>{
      body+='<w:p><w:r><w:rPr><w:highlight w:val="'+(hlMap[h.color]||'yellow')+'"/></w:rPr><w:t xml:space="preserve">'+esc(h.text)+'</w:t></w:r></w:p>';
      if(h.comment) body+='<w:p><w:r><w:rPr><w:i/><w:color w:val="666666"/></w:rPr><w:t xml:space="preserve">Nota: '+esc(h.comment)+'</w:t></w:r></w:p>';
      body+='<w:p/>';
    });
  });
  const documentXml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+body+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1417" w:right="1417" w:bottom="1417" w:left="1417"/></w:sectPr></w:body></w:document>';
  const contentTypes='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>';
  const rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
  const outZip=new JSZip();
  outZip.file('[Content_Types].xml', contentTypes);
  outZip.folder('_rels').file('.rels', rels);
  outZip.folder('word').file('document.xml', documentXml);
  const blob=await outZip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  await saveFile(bookTitleSafe()+'-subrayados.docx', blob);
}
$('#expPdf').onclick=exportPdf;
$('#expDocx').onclick=exportDocx;

async function handleFile(f){
  if(!f) return;
  bookSessionId++;
  renderSequence++;
  try{
    const buf=await f.arrayBuffer();
    await loadEpub(buf);
  }catch(err){
    hideLoading();
    $('#emptyBig').textContent='No se pudo leer este archivo';
    $('#emptyMsg').textContent='¿Seguro que es un .epub válido?';
    console.error('EPUB load ERROR:', err);
  }
}
