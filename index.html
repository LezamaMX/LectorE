<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lector de EPUB</title>

<!-- PWA Manifest y Color de Tema -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2F4B3C">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --paper:#FAF7F0; --ink:#221F1A; --ink-soft:#5B564C;
  --accent:#2F4B3C; --line:#DCD5C4; --panel:#F1ECDF;
  --serif:'Source Serif 4', Georgia, serif; --sans:'Work Sans', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B1A16; --ink:#EDE8DC; --ink-soft:#B0AA98;
    --accent:#8FBE9F; --line:#3A382E; --panel:#242219;
  }
}
:root[data-theme="dark"]{ --paper:#1B1A16; --ink:#EDE8DC; --ink-soft:#B0AA98; --accent:#8FBE9F; --line:#3A382E; --panel:#242219; }
:root[data-theme="sepia"]{ --paper:#F1E7D0; --ink:#3B2E1E; --ink-soft:#79674C; --accent:#7A4B2A; --line:#DCC9A0; --panel:#E7D8B8; }
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--paper); color:var(--ink); font-family:var(--sans); padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
.app{display:flex; height:100vh; height:100dvh}
.side{width:260px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; overflow:hidden;}
.side-head{padding:18px 16px 10px; border-bottom:1px solid var(--line)}
.side-head h1{font-size:15px; margin:0 0 2px; font-weight:600}
.side-head p{margin:0; font-size:12px; color:var(--ink-soft)}
.tabs{display:flex; border-bottom:1px solid var(--line)}
.tabs button{flex:1; background:none; border:none; padding:9px 4px; font-family:var(--sans); font-size:12px; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent}
.tabs button.active{color:var(--ink); border-color:var(--accent)}
.toc,.hlist{overflow-y:auto; flex:1; padding:8px; display:none}
.toc.show,.hlist.show{display:block}
.toc button{display:block; width:100%; text-align:left; background:none; border:none; color:var(--ink); font-family:var(--sans); font-size:13px; padding:9px 10px; border-radius:6px; cursor:pointer; line-height:1.3;}
.toc button:hover{background:var(--line)}
.toc button.active{background:var(--accent); color:var(--paper)}
.hl-card{padding:9px 10px; margin-bottom:6px; border-radius:8px; background:var(--paper); border:1px solid var(--line); cursor:pointer; font-size:12.5px; line-height:1.4;}
.hl-card .swatch{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px;}
.hl-card .snippet{color:var(--ink)}
.hl-card .cmt{color:var(--ink-soft); margin-top:4px; font-style:italic}
.hl-empty{color:var(--ink-soft); font-size:12.5px; padding:10px}
.hl-export{display:flex; gap:8px; padding:10px 10px 0}
.hl-export button{flex:1; background:var(--panel); border:1px solid var(--line); color:var(--ink); font-family:var(--sans); font-size:12px; padding:8px 4px; border-radius:7px; cursor:pointer;}
.hl-export button:hover{border-color:var(--accent)}
#hlistItems{padding:8px 8px 8px}
.main{flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; overflow:hidden;}
.topbar{display:flex; align-items:center; gap:10px; padding:10px 16px; padding-top:calc(10px + env(safe-area-inset-top,0px)); border-bottom:1px solid var(--line); background:var(--paper); flex-wrap:wrap; flex-shrink:0;}
.topbar .title{font-size:13px; color:var(--ink-soft); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ctrl{display:flex; align-items:center; gap:6px}
button.icon{background:var(--panel); border:1px solid var(--line); color:var(--ink); width:32px; height:32px; border-radius:7px; cursor:pointer; font-family:var(--sans); font-size:13px;}
button.icon:hover{border-color:var(--accent)}
label.upload{background:var(--accent); color:var(--paper); border:none; padding:8px 14px; border-radius:7px; font-family:var(--sans); font-size:13px; font-weight:500; cursor:pointer;}
input[type=file]{display:none}
.bookbar{height:3px; background:var(--line); position:relative; flex-shrink:0;}
.bookbar i{position:absolute; left:0; top:0; height:100%; background:var(--accent); width:0%; transition:width .3s}

.reader-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
  min-height: 0;
  background: var(--paper);
}
.pages-host {
  position: absolute;
  top: 40px;
  bottom: 40px;
  left: max(20px, env(safe-area-inset-left));
  right: max(20px, env(safe-area-inset-right));
  max-width: 720px;
  margin: 0 auto;
  overflow: hidden;
  padding: 0; 
}
.page-container {
  height: 100%;
  font-family: var(--serif);
  line-height: 1.65;
  font-size: var(--fs, 19px);
  transition: transform 0.3s ease;
  column-gap: 0px !important;
  -webkit-column-gap: 0px !important;
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.page-container img, 
.page-container svg, 
.page-container image {
  max-width: 100% !important;
  max-height: 75vh !important;
  width: auto !important;
  height: auto !important;
  object-fit: contain !important;
  display: block;
  margin: 10px auto;
  break-inside: avoid;
}
.page-container p { margin: 0 0 1em; }

/* Los enlaces de las notas */
.page-container a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px dotted var(--accent);
}

mark.h-yellow{background:#F6D888 !important; color:inherit !important; padding:1px 2px; border-radius:2px;}
mark.h-green{background:#B9E3BE !important; color:inherit !important; padding:1px 2px; border-radius:2px;}
mark.h-blue{background:#B9D6EE !important; color:inherit !important; padding:1px 2px; border-radius:2px;}
mark.h-pink{background:#F0C3DA !important; color:inherit !important; padding:1px 2px; border-radius:2px;}
:root[data-theme="dark"] mark{color:#1B1A16 !important}
mark{border-radius:2px; cursor:pointer; padding:0 1px; -webkit-box-decoration-break:clone; box-decoration-break:clone;}
mark.has-cmt{box-shadow:0 2px 0 var(--ink) inset}

.empty{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; color:var(--ink-soft); text-align:center; padding:24px; overflow-y:auto;}
.empty .big{font-family:var(--serif); font-size:22px; color:var(--ink)}
.library{width:100%; max-width:760px; display:flex; flex-direction:column; gap:10px; padding:8px 0 24px;}
.lib-card{display:flex; gap:12px; padding:12px 14px; border-radius:10px; background:var(--panel); border:1px solid var(--line); cursor:pointer; text-align:left; align-items:center;}
.lib-card:hover{border-color:var(--accent)}
.lib-card .cover{width:56px; height:76px; flex-shrink:0; border-radius:6px; overflow:hidden; background:linear-gradient(160deg, var(--accent), var(--ink-soft)); display:flex; align-items:center; justify-content:center; color:var(--paper); font-family:var(--serif); font-size:22px; font-weight:600;}
.lib-card .cover img{width:100%; height:100%; object-fit:cover; display:block;}
.lib-card .info{flex:1; min-width:0;}
.lib-card .info h3{margin:0 0 3px; font-family:var(--serif); font-size:16px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.lib-card .info p{margin:0; font-size:12.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.lib-card .info .prog{margin-top:6px; font-size:11.5px; color:var(--ink-soft);}
.lib-card .del{background:none; border:none; color:var(--ink-soft); font-size:18px; cursor:pointer; padding:4px 8px;}
.lib-card .del:hover{color:#c0392b}
.lib-actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:6px;}
.lib-actions button, .lib-actions label{background:var(--accent); color:var(--paper); border:none; padding:10px 18px; border-radius:8px; font-family:var(--sans); font-size:13px; font-weight:500; cursor:pointer;}
.lib-actions label.secondary{background:var(--panel); color:var(--ink); border:1px solid var(--line);}
.lib-empty{font-size:13px; color:var(--ink-soft); padding:20px; border:1px dashed var(--line); border-radius:10px; width:100%; max-width:760px;}
.nav-foot{display:flex; flex-direction:column; gap:4px; padding:8px 16px; padding-bottom:calc(8px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line); background:var(--paper); flex-shrink:0;}
.nav-foot .row{display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--ink-soft); gap:10px;}
.nav-foot button{background:none; border:1px solid var(--line); color:var(--ink); padding:7px 14px; border-radius:7px; cursor:pointer; font-family:var(--sans); font-size:13px;}
.nav-foot button:disabled{opacity:.35; cursor:default}
#selToolbar{position:fixed; display:none; background:var(--ink); border-radius:20px; padding:6px 8px; gap:6px; z-index:20; box-shadow:0 4px 14px rgba(0,0,0,.25)}
#selToolbar.show{display:flex}
#selToolbar button{width:22px; height:22px; border-radius:50%; border:2px solid var(--paper); cursor:pointer; padding:0}
#selToolbar .cmtbtn{width:auto; height:22px; border-radius:11px; border:none; background:var(--paper); color:var(--ink); font-size:11px; padding:0 8px; font-family:var(--sans)}
#loading{position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; color:#fff; font-family:var(--sans); font-size:14px; z-index:50; flex-direction:column; gap:12px; text-align:center; padding:20px;}
#loading.show{display:flex}
#loading .spinner{width:34px; height:34px; border:3px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite;}
#loading .progbar{width:220px; height:6px; background:rgba(255,255,255,.2); border-radius:3px; overflow:hidden;}
#loading .progbar i{display:block; height:100%; width:0; background:#fff; transition:width .2s;}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:720px){
  .side{position:fixed; z-index:5; height:100%; transform:translateX(-100%); transition:transform .2s}
  .side.open{transform:translateX(0)}
  .lib-card .cover{width:48px; height:66px;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="side-head">
      <h1 id="bookTitle">Sin libro cargado</h1>
      <p id="bookAuthor"></p>
      <p id="syncBadge" style="margin-top:2px"></p>
      <button id="signInBtn" class="icon" style="display:none; width:auto; padding:0 10px; height:26px; font-size:11px; margin-top:6px">Iniciar sesión con Google</button>
    </div>
    <div class="tabs">
      <button id="tabToc" class="active">Índice</button>

      <div id="hlistItems"></div>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <button class="icon" id="menuBtn" title="Índice">☰</button>
      <button class="icon" id="libBtn" title="Biblioteca" style="display:none">⌂</button>
      
      <!-- BOTÓN VOLVER (Nuevo) -->
      <button class="icon" id="backLinkBtn" title="Volver a la lectura" style="display:none; width:auto; padding:0 10px; font-weight:600; font-size:12px; background:var(--accent); color:var(--paper); border:none;">← Volver</button>
      
      <label class="upload" id="uploadLbl">Abrir EPUB<input type="file" id="file" accept=".epub"></label>
      <div class="title" id="chapterTitle"></div>
      <div class="ctrl">
        <button class="icon" id="fontDown" title="Reducir letra">A−</button>
        <button class="icon" id="fontUp" title="Aumentar letra">A+</button>
        <button class="icon" id="themeBtn" title="Tema">◐</button>
      </div>
    </div>
    <div class="bookbar"><i id="bookProgress"></i></div>
    <div class="reader-wrap" id="readerWrap">
      <div class="empty" id="emptyState">
        <div class="big" id="emptyBig">Tu biblioteca</div>
        <p id="emptyMsg">Inicia sesión con Google para guardar tus libros en la nube y retomarlos desde cualquier dispositivo.</p>
        <div class="library" id="libraryList"></div>
        <div class="lib-actions" id="libActions">
          <button id="signInLibBtn">Iniciar sesión con Google</button>
          <label class="upload secondary">Añadir EPUB local<input type="file" id="fileLib" accept=".epub"></label>
        </div>
      </div>
      <div class="pages-host" id="pagesHost" style="display:none"></div>
    </div>
    <div class="nav-foot" id="navFoot" style="display:none">
      <div class="row">
        <span id="progress"></span>
        <span id="pageIndicator"></span>

      </div>
      <div class="row">
        <button id="prevBtn">← Anterior</button>
        <span id="chapterProgress" style="font-size:11px;"></span>
        <button id="nextBtn">Siguiente →</button>
      </div>
    </div>
  </div>
</div>
<div id="selToolbar">
  <button style="background:#F6D888" data-c="yellow"></button>
  <button style="background:#B9E3BE" data-c="green"></button>
  <button style="background:#B9D6EE" data-c="blue"></button>
  <button style="background:#F0C3DA" data-c="pink"></button>
  <button class="cmtbtn" id="cmtBtn">+ nota</button>
</div>
<div id="loading">
  <div class="spinner"></div>
  <div id="loadingText">Cargando…</div>
  <div class="progbar" id="loadingBar" style="display:none"><i id="loadingBarFill"></i></div>
</div>

<script>
const themes=['light','dark','sepia']; let themeIdx=0;
const fontSizes=[16,17,18,19,21,23,25]; let fontIdx=3;
let spine=[], zip=null, opfDir='', currentIndex=0, tocItems=[];
let bookId='', highlights=[], wordCounts=[], totalBookWords=0, pendingRange=null;
let chapterStart=0, activeMs=0, hidden=false;
let bookCoverDataUrl='';

let currentPage=0;
let totalPages=1;
let pageRestoreTarget=0;
let pendingGoLastPage=false;

// Historial para los enlaces de notas (Nuevo)
let linkHistory = [];
let pendingAnchor = null;

const $=s=>document.querySelector(s);
const readerWrap=$('#readerWrap'), emptyEl=$('#emptyState'), tocEl=$('#toc'),
  hlistEl=$('#hlist'), chapterTitleEl=$('#chapterTitle'), navFoot=$('#navFoot'),
  prevBtn=$('#prevBtn'), nextBtn=$('#nextBtn'), progressEl=$('#progress'),
  timeLeftEl=$('#timeLeft'), bookProgress=$('#bookProgress'), selToolbar=$('#selToolbar'),
  libraryListEl=$('#libraryList'), libActionsEl=$('#libActions'), loadingEl=$('#loading'),
  loadingTextEl=$('#loadingText'), loadingBar=$('#loadingBar'), loadingBarFill=$('#loadingBarFill'),
  pagesHost=$('#pagesHost'),
  pageIndicatorEl=$('#pageIndicator'), chapterProgressEl=$('#chapterProgress');

document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ activeMs += Date.now()-chapterStart; hidden=true; }
  else { chapterStart=Date.now(); hidden=false; }
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(e=>{}); });
}

const dbPromise = new Promise((resolve, reject) => {
  const req = indexedDB.open('EReaderDB', 1);
  req.onupgradeneeded = e => e.target.result.createObjectStore('books');
  req.onsuccess = e => resolve(e.target.result);
  req.onerror = e => reject(e);
});
async function saveBookToIDB(id, buffer) {
  const db = await dbPromise; const tx = db.transaction('books', 'readwrite');
  tx.objectStore('books').put(buffer, id); return new Promise(r => tx.oncomplete = r);
}
async function getBookFromIDB(id) {
  const db = await dbPromise; const tx = db.transaction('books', 'readonly');
  const req = tx.objectStore('books').get(id);
  return new Promise(r => { req.onsuccess = () => r(req.result); req.onerror = () => r(null); });
}

function loadJSON(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function saveJSON(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function getStats(){ return loadJSON('epubStats', {totalWords:0, totalMinutes:0}); }
function recordSession(words, minutes){
  if(minutes < 0.15 || words < 20) return;
  const s=getStats(); s.totalWords+=words; s.totalMinutes+=minutes; saveJSON('epubStats', s); pushStats();
}
function avgWpm(){ const s=getStats(); return s.totalMinutes>0.3 ? Math.max(80, s.totalWords/s.totalMinutes) : 200; }

function showLoading(text, showBar){
  loadingTextEl.textContent = text || 'Cargando…'; loadingBar.style.display = showBar ? 'block' : 'none';
  loadingBarFill.style.width = '0%'; loadingEl.classList.add('show');
}
function setLoadingProgress(pct){ loadingBarFill.style.width = Math.max(0,Math.min(100,pct))+'%'; }
function hideLoading(){ loadingEl.classList.remove('show'); }

const firebaseConfig = {
  apiKey: "AIzaSyAESUMrg4kBhqhKDgANTBrkfyZjaiYYsK8", authDomain: "ereader-69997.firebaseapp.com",
  projectId: "ereader-69997", storageBucket: "ereader-69997.firebasestorage.app",
  messagingSenderId: "596698647357", appId: "1:596698647357:web:afaa6a8f0a31c12e6f9354"
};
let fbAuth=null, fbDb=null, cloudUid=null, cloudReady=false, firebaseConfigured=false;
let authReadyResolve; const authReadyPromise=new Promise(r=>authReadyResolve=r);
let bookSessionId=0, cloudSyncInFlight=0, renderSequence=0;
const CHUNK_SIZE = 600 * 1024; const MAX_COVER_BYTES = 200 * 1024;

(function initFirebase(){
  if(!firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf('TU_')===0){ authReadyResolve(); return; }
  try{
    firebase.initializeApp(firebaseConfig); fbAuth=firebase.auth(); fbDb=firebase.firestore();
    fbDb.enablePersistence().catch(e=>{}); firebaseConfigured=true; $('#signInBtn').style.display='inline-block';
    let first=true;
    fbAuth.onAuthStateChanged(async user=>{
      cloudUid=user?user.uid:null; cloudReady=!!cloudUid;
      $('#syncBadge').textContent = cloudReady ? 'Sincronizado ☁ ('+(user.displayName||user.email||'Cuenta')+')' : '';
      $('#signInBtn').textContent = cloudReady ? 'Cerrar sesión' : 'Iniciar sesión con Google';
      if(first){ first=false; authReadyResolve(); }
      if(cloudReady){
        try{ const snap=await fbDb.doc('users/'+cloudUid).get(); if(snap.exists && snap.data().stats){ saveJSON('epubStats', snap.data().stats); } }catch(e){}
        if(bookId) syncCurrentBookFromCloud().catch(e=>{});
        if(pagesHost.style.display==='none') loadLibrary();
      }else{ if(pagesHost.style.display==='none') loadLibrary(); }
    });
  }catch(e){ authReadyResolve(); }
})();

function handleSignIn(){
  if(!firebaseConfigured){ alert('Firebase no configurado.'); return; }
  if(cloudReady){ fbAuth.signOut(); return; }
  fbAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{});
}
$('#signInBtn').onclick=handleSignIn; $('#signInLibBtn').onclick=handleSignIn;

function pushStats(){ if(!cloudReady) return; try{ fbDb.doc('users/'+cloudUid).set({stats:getStats()}, {merge:true}).catch(e=>{}); }catch(e){} }
function pushBookState(){
  if(!cloudReady || !bookId) return;
  try{ fbDb.doc('users/'+cloudUid+'/books/'+bookId).set({ currentIndex, highlights, pageIndex: currentPage, updatedAt: Date.now() }, {merge:true}).catch(e=>{}); }catch(e){}
}
async function pullBookState(bookIdOverride=bookId, uidOverride=cloudUid){
  if(!cloudReady || !bookIdOverride || !uidOverride) return null;
  try{ const snap=await fbDb.doc('users/'+uidOverride+'/books/'+bookIdOverride).get(); return snap.exists?snap.data():null; }catch(e){ return null; }
}

async function syncCurrentBookFromCloud(){
  if(!cloudReady || !bookId || !spine.length) return;
  const syncId=++cloudSyncInFlight; const syncBookId=bookId, syncUid=cloudUid; const syncSession=bookSessionId, syncIndex=currentIndex;
  const remote=await pullBookState(syncBookId, syncUid);
  if(syncId!==cloudSyncInFlight || syncBookId!==bookId || syncUid!==cloudUid || syncSession!==bookSessionId) return;
  if(remote){
    highlights=Array.isArray(remote.highlights)?remote.highlights:[]; saveJSON('epubHl_'+bookId, highlights);
    const remoteIndex=typeof remote.currentIndex==='number' ? Math.max(0, Math.min(remote.currentIndex, spine.length-1)) : 0;
    const remotePage=typeof remote.pageIndex==='number' ? remote.pageIndex : 0;
    if(currentIndex===syncIndex){ saveJSON('epubProg_'+bookId, {index: remoteIndex, pageIndex: remotePage}); pageRestoreTarget = remotePage; await renderChapter(remoteIndex); }
    else { renderHlist(); applyHighlights(); }
  }else{ pushBookState(); }
}

function arrayBufferToBase64(buf){ let binary=''; const bytes=new Uint8Array(buf); const CH=0x8000; for(let i=0;i<bytes.length;i+=CH){ binary+=String.fromCharCode.apply(null, bytes.subarray(i, i+CH)); } return btoa(binary); }
function base64ToArrayBuffer(b64){ const binary=atob(b64); const len=binary.length; const bytes=new Uint8Array(len); for(let i=0;i<len;i++) bytes[i]=binary.charCodeAt(i); return bytes.buffer; }

async function uploadBookToCloud(buf, meta){
  if(!cloudReady || !fbDb) return;
  const docRef=fbDb.doc('users/'+cloudUid+'/books/'+meta.bookId); const existing=await docRef.get();
  if(existing.exists && existing.data().chunks){ await docRef.set({ title: meta.title, author: meta.author, totalChapters: meta.totalChapters||0, cover: meta.cover||'' }, {merge:true}); return; }
  const totalChunks=Math.ceil(buf.byteLength / CHUNK_SIZE); showLoading('Subiendo a la nube… 0 / '+totalChunks, true);
  await docRef.set({ bookId: meta.bookId, title: meta.title, author: meta.author, totalChapters: meta.totalChapters||0, chunks: totalChunks, size: buf.byteLength, addedAt: Date.now(), currentIndex: 0, highlights: [], pageIndex: 0, cover: meta.cover||'' }, {merge:true});
  const chunksCol=docRef.collection('chunks');
  for(let i=0;i<totalChunks;i++){
    await chunksCol.doc(String(i)).set({ data: arrayBufferToBase64(buf.slice(i*CHUNK_SIZE, Math.min((i+1)*CHUNK_SIZE, buf.byteLength))) });
    setLoadingProgress(Math.round((i+1)/totalChunks*100)); loadingTextEl.textContent='Subiendo a la nube… '+(i+1)+' / '+totalChunks;
  }
  hideLoading();
}

async function downloadBookFromCloud(bookIdToLoad){
  if(!cloudReady) throw new Error('No hay sesión en la nube.');
  const docRef=fbDb.doc('users/'+cloudUid+'/books/'+bookIdToLoad); const snap=await docRef.get();
  if(!snap.exists) throw new Error('Libro no encontrado.');
  const meta=snap.data(); const totalChunks=meta.chunks||0; if(!totalChunks) throw new Error('Sin archivo.');
  const chunksCol=docRef.collection('chunks'); const parts=[];
  for(let i=0;i<totalChunks;i++){
    const cs=await chunksCol.doc(String(i)).get(); if(!cs.exists) throw new Error('Falta fragmento.');
    parts.push(base64ToArrayBuffer(cs.data().data)); setLoadingProgress(Math.round((i+1)/totalChunks*100)); loadingTextEl.textContent='Descargando… '+(i+1)+' / '+totalChunks;
  }
  let total=0; parts.forEach(p=>total+=p.byteLength); const out=new Uint8Array(total); let off=0;
  parts.forEach(p=>{ out.set(new Uint8Array(p), off); off+=p.byteLength; });
  return { buf: out.buffer, meta };
}

function resolvePath(base, rel){
  if(rel.startsWith('/')) return rel.slice(1);
  const baseParts=base.split('/'); baseParts.pop();
  for(const p of rel.split('/')){ if(p==='..') baseParts.pop(); else if(p!=='.') baseParts.push(p); }
  return baseParts.join('/');
}

async function extractCover(opfDoc, manifest){
  try{
    let coverId=opfDoc.querySelector('metadata > meta[name="cover"]')?.getAttribute('content');
    if(!coverId) coverId=opfDoc.querySelector('manifest > item[properties~="cover-image"]')?.getAttribute('id');
    if(coverId && manifest[coverId]){ const f=await findFile(manifest[coverId].href); if(f){ const blob=await f.async('blob'); return await blobToDataURL(blob, MAX_COVER_BYTES) || ''; } }
  }catch(e){} return '';
}
function blobToDataURL(blob, maxBytes){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{
      const d=r.result; if(d.length < maxBytes*1.37) return res(d);
      const img=new Image(); img.onload=()=>{ const maxW=300, maxH=400; const ratio=Math.min(maxW/img.width, maxH/img.height, 1); const cvs=document.createElement('canvas'); cvs.width=Math.round(img.width*ratio); cvs.height=Math.round(img.height*ratio); cvs.getContext('2d').drawImage(img, 0, 0, cvs.width, cvs.height); try{ res(cvs.toDataURL('image/jpeg', 0.8)); }catch(e){ res(d); } }; img.onerror=()=>res(d); img.src=d;
    }; r.onerror=()=>res(''); r.readAsDataURL(blob);
  });
}

async function computeWordCounts(){

  for(let i=0;i<spine.length;i++){ try{ const f=await findFile(spine[i]); if(f){ const html=await f.async('string'); const wc=wordCount(plainText(html)); wordCounts[i]=wc; totalBookWords+=wc; } }catch(e){} }

function wordsReadSoFar(){
  let sum=0; for(let i=0;i<currentIndex;i++) sum+=wordCounts[i]||0;
  return sum + (wordCounts[currentIndex]||0)*(totalPages>1 ? (currentPage/(totalPages-1)) : 0);
}

  const remaining=Math.max(0,totalBookWords-read); const mins=Math.round(remaining/avgWpm());
  timeLeftEl.textContent = mins<1 ? 'Casi terminas' : mins<60 ? ('≈ '+mins+' min') : ('≈ '+Math.floor(mins/60)+'h '+(mins%60)+'m');

function getAnchorPage(anchor) {
  if(!anchor) return -1;
  const container = pagesHost.querySelector('.page-container');
  if(!container) return -1;
  try {
    const el = container.querySelector(`[id="${anchor}"], [name="${anchor}"]`);
    if (el) {
      const oldT = container.style.transform; container.style.transform = 'none';
      const relX = el.getBoundingClientRect().left - pagesHost.getBoundingClientRect().left;
      container.style.transform = oldT;
      return Math.max(0, Math.floor(relX / pagesHost.clientWidth));
    }
  } catch(e){}
  return -1;
}

pagesHost.addEventListener('click', e => {

    linkHistory.push({ index: currentIndex, page: currentPage });
    $('#backLinkBtn').style.display = 'inline-block';

    const resolved = resolvePath(spine[currentIndex], href);
    const [pathPart, hashPart] = resolved.split('#');
    let targetIndex = spine.findIndex(s => s.split('#')[0] === pathPart);
    if (targetIndex === -1 && !pathPart) targetIndex = currentIndex;

    if (targetIndex >= 0 && targetIndex < spine.length) {
      if (targetIndex !== currentIndex) {
        pendingAnchor = hashPart; pageRestoreTarget = 0; renderChapter(targetIndex);
      } else if (hashPart) {
        const p = getAnchorPage(hashPart);
        if (p !== -1) { currentPage = Math.min(p, totalPages - 1); showPage(currentPage); updatePageUI(); pushBookState(); }
      }
    }
  }
});

};

async function renderChapter(index){
  if(index<0||index>=spine.length) return;
  const thisRender=++renderSequence; currentIndex=index; chapterStart=Date.now(); activeMs=0;
  saveJSON('epubProg_'+bookId, {index, pageIndex: 0}); pushBookState();
  const path=spine[index]; const file=await findFile(path);
  if(!file){ pagesHost.innerHTML='<div class="page-container"><p>Error al cargar capítulo.</p></div>'; totalPages=1; return; }
  let html=await file.async('string'); if(thisRender!==renderSequence) return;
  const doc=new DOMParser().parseFromString(html,'application/xhtml+xml');
  const body=doc.querySelector('body')||doc.documentElement;

  for(const img of body.querySelectorAll('img, image')){
    const attr=img.hasAttribute('src')?'src':(img.hasAttribute('xlink:href')?'xlink:href':null);
    if(!attr) continue; const rel=img.getAttribute(attr); if(!rel) continue;
    const imgFile=await findFile(resolvePath(path, rel));
    if(imgFile){ const blob=await imgFile.async('blob'); img.setAttribute(attr, URL.createObjectURL(blob)); }
  }

  const container = document.createElement('div'); container.className = 'page-container';
  container.innerHTML = body.innerHTML; pagesHost.innerHTML = ''; pagesHost.appendChild(container);
  
  const contentWidth = pagesHost.clientWidth;
  container.style.columnWidth = contentWidth + 'px'; container.style.WebkitColumnWidth = contentWidth + 'px';
  await preloadImages(container);
  totalPages = Math.max(1, Math.round(container.scrollWidth / contentWidth));

  applyHighlights(); renderHlist();
  const active=tocItems.find(t=>t.href.split('#')[0]===path.split('#')[0]);
  chapterTitleEl.textContent=active?active.label:''; progressEl.textContent=(index+1)+' / '+spine.length;

  if (pendingAnchor) {
    const p = getAnchorPage(pendingAnchor);
    currentPage = p !== -1 ? Math.min(p, totalPages - 1) : 0;
    pendingAnchor = null;
  } else {
    let target=pageRestoreTarget||0; if(pendingGoLastPage){ target=totalPages-1; pendingGoLastPage=false; }
    pageRestoreTarget=0; currentPage=Math.max(0, Math.min(target, totalPages-1));
  }
  
  showPage(currentPage); updateTimeEstimate(); updatePageUI();
}

function preloadImages(root){
  const imgs=[...root.querySelectorAll('img')]; if(!imgs.length) return Promise.resolve();
  return Promise.all(imgs.map(img=>{
    if(img.complete && img.naturalWidth>0) return Promise.resolve();
    return new Promise(res=>{ img.addEventListener('load', res, {once:true}); img.addEventListener('error', res, {once:true}); setTimeout(res, 3000); });
  }));
}

function nodeOffset(container, node, offsetInNode){ let charIndex=0; const w=document.createTreeWalker(container, NodeFilter.SHOW_TEXT); let n; while(n=w.nextNode()){ if(n===node) return charIndex+offsetInNode; charIndex+=n.length; } return -1; }
function rangeFromOffsets(container, start, end){ let charIndex=0, startNode,startOffset,endNode,endOffset; const w=document.createTreeWalker(container, NodeFilter.SHOW_TEXT); let n; while(n=w.nextNode()){ const next=charIndex+n.length; if(!startNode && start>=charIndex && start<=next){ startNode=n; startOffset=start-charIndex; } if(!endNode && end>=charIndex && end<=next){ endNode=n; endOffset=end-charIndex; } charIndex=next; } if(!startNode||!endNode) return null; const r=document.createRange(); r.setStart(startNode,startOffset); r.setEnd(endNode,endOffset); return r; }
function rangeFromText(container, searchText){ if(!searchText) return null; const needle=searchText.replace(/\s+/g,' ').trim(); if(needle.length<2) return null; const walker=document.createTreeWalker(container, NodeFilter.SHOW_TEXT); const nodes=[]; const starts=[]; let acc=''; let n; while(n=walker.nextNode()){ nodes.push(n); starts.push(acc.length); acc+=n.nodeValue; } const haystack=acc.replace(/\s+/g,' '); const escaped=needle.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+'); const m=new RegExp(escaped).exec(haystack); if(!m) return null; const matchStart=m.index, matchEnd=m.index+m[0].length; let startNode=null, startOffset=0, endNode=null, endOffset=0; for(let i=0;i<nodes.length;i++){ const s=starts[i]; const e=s+nodes[i].nodeValue.length; if(!startNode && matchStart>=s && matchStart<=e){ startNode=nodes[i]; startOffset=matchStart-s; } if(!endNode && matchEnd>=s && matchEnd<=e){ endNode=nodes[i]; endOffset=matchEnd-s; } } if(!startNode||!endNode) return null; try{ const r=document.createRange(); r.setStart(startNode, startOffset); r.setEnd(endNode, endOffset); return r; }catch(e){ return null; } }

function applyHighlights(){
  const chHref=spine[currentIndex]; const hs=highlights.filter(h=>h.href===chHref).sort((a,b)=>a.start-b.start);
  const container = pagesHost.querySelector('.page-container'); if(!container) return;
  hs.forEach(h=>{
    let r=rangeFromOffsets(container, h.start, h.end); const rText=r?r.toString().replace(/\s+/g,' ').trim():''; const expected=(h.text||'').replace(/\s+/g,' ').trim();
    if(!r || (expected && rText && !rText.startsWith(expected.slice(0, Math.min(20, expected.length))))){ const r2=rangeFromText(container, expected); if(r2) r=r2; }
    if(!r) return; if(r.startContainer.parentElement && r.startContainer.parentElement.closest('mark[data-id="'+h.id+'"]')) return;
    try{ const frag=r.extractContents(); const walker=document.createTreeWalker(frag, NodeFilter.SHOW_TEXT); const textNodes=[]; let n; while(n=walker.nextNode()) textNodes.push(n);
      textNodes.forEach(tn=>{ if(!tn.nodeValue || !tn.nodeValue.trim()) return; const m=document.createElement('mark'); m.className='h-'+h.color+(h.comment?' has-cmt':''); m.dataset.id=h.id; m.onclick=()=>openHlPopup(h.id); tn.parentNode.replaceChild(m, tn); m.appendChild(tn); }); r.insertNode(frag);
    }catch(e){}
  });
}

function openHlPopup(id){
  const h=highlights.find(x=>x.id===id); if(!h) return;
  const action=prompt('Nota para este subrayado:\n\nEscribe "borrar" para eliminarlo.', h.comment||''); if(action===null) return;
  let nuevasNotas = JSON.parse(JSON.stringify(highlights)); const idx = nuevasNotas.findIndex(x=>x.id===id);
  if(action.trim().toLowerCase()==='borrar'){ nuevasNotas.splice(idx,1); } else { nuevasNotas[idx].comment=action; }
  highlights = nuevasNotas; saveJSON('epubHl_'+bookId, highlights); pushBookState(); renderChapter(currentIndex);
}

const hlistItemsEl=$('#hlistItems');
function renderHlist(){
  const colorDot={yellow:'#F6D888',green:'#B9E3BE',blue:'#B9D6EE',pink:'#F0C3DA'};
  if(!highlights.length){ hlistItemsEl.innerHTML='<div class="hl-empty">Aún no tienes subrayados.</div>'; return; }
  hlistItemsEl.innerHTML='';
  highlights.slice().reverse().forEach(h=>{
    const idx=spine.indexOf(h.href); const card=document.createElement('div'); card.className='hl-card';
    card.innerHTML='<span class="swatch" style="background:'+(colorDot[h.color]||'#F6D888')+'"></span><span class="snippet">'+escapeHtml(h.text)+'</span>'+(h.comment?'<div class="cmt">'+escapeHtml(h.comment)+'</div>':'');
    card.onclick=()=>{ goTo(idx); $('#side').classList.remove('open'); }; hlistItemsEl.appendChild(card);
  });
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function goToLibrary(){
  finishChapterTiming(); pushBookState();
  spine=[]; zip=null; bookId=''; highlights=[]; wordCounts=[]; totalBookWords=0;
  pageRestoreTarget=0; currentPage=0; totalPages=1;
  linkHistory=[]; $('#backLinkBtn').style.display='none'; // Reiniciamos el botón de volver
  pagesHost.style.display='none'; pagesHost.innerHTML='';
  navFoot.style.display='none'; $('#libBtn').style.display='none';
  $('#bookTitle').textContent='Sin libro cargado'; $('#bookAuthor').textContent=''; $('#chapterTitle').textContent='';
  bookProgress.style.width='0%'; emptyEl.style.display='flex'; loadLibrary();
}
$('#libBtn').onclick=goToLibrary;
async function handleFile(f){ if(!f) return; bookSessionId++; renderSequence++; try{ const buf=await f.arrayBuffer(); await loadEpub(buf); } catch(err){ hideLoading(); $('#emptyBig').textContent='No se pudo leer'; $('#emptyMsg').textContent='¿Es un .epub válido?'; } }
$('#file').addEventListener('change', e=>handleFile(e.target.files[0])); $('#fileLib').addEventListener('change', e=>handleFile(e.target.files[0]));
loadLibrary();
</script>
